services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${CLIPPING_DB_NAME}
      POSTGRES_USER: ${CLIPPING_DB_USER}
      POSTGRES_PASSWORD: ${CLIPPING_DB_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLIPPING_DB_USER} -d ${CLIPPING_DB_NAME}"]
      interval: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CLIPPING_DB_HOST: postgres
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/opt/clipping-system/.env:ro
      - ./logs:/opt/clipping-system/logs
      - ./gog/config:/root/.config/gogcli
      - ./gog/share:/root/.local/share/gogcli
    depends_on:
      postgres:
        condition: service_healthy
